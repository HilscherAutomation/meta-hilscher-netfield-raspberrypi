# We have a conf and classes directory, add to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hilscher-netfield-raspberrypi"
BBFILE_PATTERN_hilscher-netfield-raspberrypi := "^${LAYERDIR}/"
BBFILE_PRIORITY_hilscher-netfield-raspberrypi = "100"

LAYERSERIES_COMPAT_hilscher-netfield-raspberrypi = "kirkstone"
LAYERDEPENDS_hilscher-netfield-raspberrypi = " \
	core yocto hilscher-netfield hilscher-netfield-oem raspberrypi gplv2 security tpm-layer \
	openembedded-layer multimedia-layer networking-layer perl-layer meta-python \
	webserver swupdate \
"

KEYS_DIR := "${LAYERDIR}/keys"

BSP_DEPLOYSCRIPT_DIR = "${LAYERDIR}/scripts/deploy"

BBMASK += " \
    meta-raspberrypi/recipes-kernel/linux/linux-raspberrypi_5.10.bb \
    meta-raspberrypi/recipes-kernel/linux/linux-raspberrypi_6.1.bb \
"

